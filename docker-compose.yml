# docker compose up --build : lance le serveur MLflow (port 5050) et l'API (port 8000)
services:
  mlflow:
    build: .
    command: >
      mlflow server --host 0.0.0.0 --port 5050
      --backend-store-uri sqlite:////mlflow_data/mlflow.db
      --artifacts-destination /mlflow_data/artifacts
      --allowed-hosts "mlflow:5050,localhost:5050,127.0.0.1:5050"
    ports:
      - "5050:5050"
    volumes:
      - ./mlflow_data:/mlflow_data

  api:
    build: .
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5050
      - MODEL_NAME=taxi-demand
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
