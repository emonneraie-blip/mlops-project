name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions épinglées sur un SHA (un tag peut bouger)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Installer depuis le lock
        run: uv sync --locked
      - name: Tests (unitaires + intégration API)
        run: uv run pytest -q

  docker:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Construire l'image, taguée avec le commit (jamais latest)
        run: docker build -t taxi-demand-api:${{ github.sha }} .
