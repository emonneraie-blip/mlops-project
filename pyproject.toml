[project]
name = "mlops-taxi-demand"
version = "0.1.0"
description = "Prévision de la demande de taxis à New York, avec la couche MLOps (MLflow, DVC, FastAPI, drift, rollback)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "mlflow>=2.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "dvc>=3.55",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
